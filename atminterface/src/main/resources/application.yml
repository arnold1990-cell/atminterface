spring:
  application:
    name: atminterface
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atmdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

atm:
  withdraw-multiple: 10
